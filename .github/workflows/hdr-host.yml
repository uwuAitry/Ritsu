name: hdr-host

on:
  push:
    paths:
      - "tools/hdr-host/**"
      - ".github/workflows/hdr-host.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish host
        run: dotnet publish tools/hdr-host/HdrHost.csproj -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: hdr-host-win-x64
          path: publish
